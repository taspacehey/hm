<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🔒</title>
<style>
  :root{
    --bg:#efeae2; --bar:#075e54; --card:#ffffff; --text:#1f2937; --muted:#6b7280;
    --mine:#d9fdd3;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);}
  .hidden{display:none !important}

  /* ---------- login ---------- */
  #lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#075e54,#128c7e)}
  .box{background:var(--card);padding:28px 24px;border-radius:16px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .box h1{margin:0 0 6px;font-size:28px}
  .box p{margin:0 0 18px;color:var(--muted);font-size:14px}
  .box input{width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:10px;font:inherit;font-size:16px;margin-bottom:12px}
  .box button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--bar);color:#fff;font:inherit;font-size:16px;cursor:pointer}
  .box button:disabled{opacity:.6}
  #err{color:#b91c1c;font-size:14px;min-height:20px;margin-top:10px;word-break:break-all;user-select:all}

  /* ---------- app ---------- */
  #app{height:100%;display:flex;flex-direction:column}
  header{background:var(--bar);color:#fff;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:max(10px,env(safe-area-inset-top))}
  header b{font-size:20px}
  header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:15px;cursor:pointer}
  #list{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px}
  .day{align-self:center;background:#e1f2fb;color:#475569;font-size:12px;padding:3px 12px;border-radius:999px;margin:8px 0}
  .empty{align-self:center;color:var(--muted);margin-top:40px;font-size:14px}

  .bubble{max-width:82%;padding:7px 10px 5px;border-radius:12px;box-shadow:0 1px 1px rgba(0,0,0,.12);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.5;font-size:16px}
  .bubble.mine{align-self:flex-end;background:var(--mine);border-top-right-radius:2px}
  .bubble.other{align-self:flex-start;border-top-left-radius:2px}
  .meta{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:11px;color:var(--muted);margin-top:2px;white-space:normal}
  .meta .del{cursor:pointer;opacity:.6}
  .meta .del:hover{opacity:1;color:#b91c1c}
  .bubble.failed{outline:2px solid #ef4444;cursor:pointer}

  .pic{display:block;max-width:100%;max-height:300px;min-width:120px;min-height:80px;border-radius:8px;background:#e5e7eb;cursor:zoom-in;color:var(--muted);font-size:12px}
  .vid{display:block;max-width:100%;max-height:320px;border-radius:8px;background:#000}
  audio{display:block;width:240px;max-width:100%;height:40px}
  .mbtn{border:0;border-radius:8px;padding:8px 16px;background:var(--bar);color:#fff;font:inherit;font-size:14px;cursor:pointer}

  #viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
  #viewer img{max-width:96%;max-height:96%;border-radius:6px}

  form{display:flex;gap:8px;padding:8px 10px;background:#f0f2f5;padding-bottom:max(8px,env(safe-area-inset-bottom))}
  textarea{flex:1;resize:none;border:0;border-radius:20px;padding:10px 14px;font:inherit;font-size:16px;max-height:120px;min-height:44px;outline:none}
  form button{border:0;border-radius:50%;width:46px;height:46px;background:var(--bar);color:#fff;font-size:20px;cursor:pointer;align-self:flex-end;flex:none}
  form button.attach{background:#fff;color:var(--bar);box-shadow:0 1px 2px rgba(0,0,0,.15)}
  form button.attach.on{background:#dc2626;color:#fff}
</style>
</head>
<body>

<!-- password screen -->
<div id="lock">
  <div class="box">
    <h1>🔒</h1>
    <p>Enter password to open</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button id="enter">Open</button>
    <div id="err"></div>
  </div>
</div>

<!-- main app -->
<div id="app" class="hidden">
  <header>
    <b>🔒</b>
    <button id="lockBtn">Lock</button>
  </header>
  <div id="list"></div>
  <form id="form">
    <button type="button" class="attach" id="attach" aria-label="Photo or video">📎</button>
    <input type="file" id="file" accept="image/*,video/*" hidden>
    <textarea id="ta" rows="1" maxlength="3000" placeholder="Write a note..."></textarea>
    <button type="button" class="attach" id="mic" aria-label="Voice message">🎤</button>
    <button type="submit" aria-label="Send">➤</button>
  </form>
</div>

<div id="viewer" class="hidden"><img id="viewerImg" alt=""></div>

<script>
/* ============ settings ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwX8yKc-If4xp08pCor3V16yvZC7dVPVqyZAdKNb3NYZ4AwPkmVxoN6gM4ctoBwbKtP/exec';
const SALT = 'gopon-note-v1-salt';   // must be the same on every device, do not change
const POLL_MS = 5000;                // how often to check for new messages
const IMG_MAX = 1280;                // max photo size in pixels
const IMG_QUALITY = 0.72;            // photo quality (0 to 1)
const VIDEO_MAX_MB = 15;             // max video size
const VOICE_MAX_SEC = 300;           // max voice message length
const PLACEHOLDER = 'Write a note...';
const PW_HASH = 'bf4b4e7e73307aead8f8b0d5a4306235f8cbadb06dfe8d5e24fcfac474c416c9';                  // paste your password hash here (see instructions)
/* ================================== */

const enc = new TextEncoder(), dec = new TextDecoder();
const $ = id => document.getElementById(id);
let key = null;
let messages = [];
let lastSig = '';
let dirty = false;
const cache = new Map();      // id -> payload object
const mediaUrls = new Map();  // id -> blob URL (photo / video / voice)
const loading = new Set();    // media being downloaded
const pending = new Set();    // not yet on the server
const deleted = new Set();    // deleted locally
let timer = null;

/* identity of this device (different on every device) */
const myDevice = (function () {
  try {
    let d = localStorage.getItem('gn_device');
    if (!d) {
      d = 'd-' + (crypto.randomUUID ? crypto.randomUUID() : Date.now() + Math.random().toString(36).slice(2));
      localStorage.setItem('gn_device', d);
    }
    return d;
  } catch (e) { return 'd-tmp-' + Math.random().toString(36).slice(2); }
})();

/* ---------- encryption (AES-GCM) ---------- */
function toB64(buf) {
  const b = new Uint8Array(buf); let s = '';
  for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192));
  return btoa(s);
}
function fromB64(s) { const bin = atob(s); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; }

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode(SALT), iterations: 150000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
/* password check code (not the password itself) */
async function pwHash(pw) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: enc.encode(SALT + ':check'), iterations: 150000, hash: 'SHA-256' }, base, 256);
  return Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function encryptBytes(bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, bytes);
  const out = new Uint8Array(12 + ct.byteLength);
  out.set(iv, 0); out.set(new Uint8Array(ct), 12);
  return toB64(out);
}
async function decryptBytes(b64) {
  const b = fromB64(b64);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, key, b.slice(12));
  return new Uint8Array(pt);
}
const encryptText = t => encryptBytes(enc.encode(t));
const decryptText = async b64 => dec.decode(await decryptBytes(b64));

/* payload: plain text, or {"gn":1,"type":"img"|"vid"|"aud",...} */
function parsePayload(s) {
  if (s.indexOf('{"gn":1') === 0) {
    try { const o = JSON.parse(s); if (o && o.type) return o; } catch (e) {}
  }
  return { type: 'txt', x: s };
}

/* ---------- talk to Google Sheet / Drive ---------- */
async function apiGet() {
  const r = await fetch(API_URL, { cache: 'no-store' });
  return r.json();
}
async function apiPost(body) {
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body)
  });
  return r.json();
}

/* ---------- sync ---------- */
async function sync() {
  const rows = await apiGet();
  const out = [];
  const seen = new Set();
  for (const r of rows) {
    if (deleted.has(r.id)) continue;
    seen.add(r.id);
    let p = cache.get(r.id);
    if (p === undefined) {
      try { p = parsePayload(await decryptText(r.data)); } catch (e) { p = { type: 'txt', x: '⚠️ Could not read' }; }
      cache.set(r.id, p);
    }
    out.push({ id: r.id, time: r.time, device: r.device, p });
  }
  // keep messages that have not reached the server yet
  for (const m of messages) {
    if (!seen.has(m.id) && (pending.has(m.id) || m.failed) && !deleted.has(m.id)) out.push(m);
  }
  out.sort((a, b) => a.time - b.time);
  messages = out;
  render();
}

/* ---------- colours ---------- */
const PALETTE = ['#dbeafe', '#fde2e4', '#fef3c7', '#ede9fe', '#cffafe', '#fee2e2'];
function colorFor(dev) {
  let h = 0;
  for (let i = 0; i < dev.length; i++) h = (h * 31 + dev.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

/* ---------- media ---------- */
function fmtSize(n) { return (n / 1048576).toFixed(1) + ' MB'; }
function fmtDur(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

async function loadMedia(m, manual) {
  const t = m.p.type;
  if (!m.p.fid || mediaUrls.has(m.id) || loading.has(m.id)) return;
  if (t === 'vid' && !manual) return;           // videos load only when tapped
  loading.add(m.id);
  try {
    const r = await fetch(API_URL + '?file=' + encodeURIComponent(m.p.fid), { cache: 'no-store' });
    const text = await r.text();
    const bytes = await decryptBytes(text);
    const mime = m.p.mime || (t === 'img' ? 'image/jpeg' : '');
    mediaUrls.set(m.id, URL.createObjectURL(new Blob([bytes], { type: mime })));
    loading.delete(m.id);
    render(true);
  } catch (e) {
    loading.delete(m.id);
    if (manual) { alert('Could not load. Try again.'); render(true); }
  }
}
function openViewer(src) {
  if (!src) return;
  $('viewerImg').src = src;
  $('viewer').classList.remove('hidden');
}

/* ---------- display ---------- */
function nearBottom() {
  const l = $('list');
  return l.scrollHeight - l.scrollTop - l.clientHeight < 120;
}
function mediaBusy() {
  return Array.prototype.some.call($('list').querySelectorAll('audio,video'), e => !e.paused && !e.ended);
}
function render(force) {
  const sig = messages.map(m => m.id + (m.failed ? 'f' : '') + (pending.has(m.id) ? 'p' : '') + (mediaUrls.has(m.id) ? 'i' : '')).join('|');
  if (!force && sig === lastSig) return;
  if (mediaBusy()) { dirty = true; return; }   // do not interrupt playback
  lastSig = sig; dirty = false;

  const l = $('list');
  const stick = nearBottom();
  l.innerHTML = '';
  if (!messages.length) {
    const e = document.createElement('div');
    e.className = 'empty'; e.textContent = 'No notes yet. Write one below.';
    l.appendChild(e);
    return;
  }
  let lastDay = '';
  for (const m of messages) {
    const d = new Date(m.time);
    const day = d.toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' });
    if (day !== lastDay) {
      const s = document.createElement('div');
      s.className = 'day'; s.textContent = day;
      l.appendChild(s);
      lastDay = day;
    }
    const mine = m.device === myDevice;
    const b = document.createElement('div');
    b.className = 'bubble ' + (mine ? 'mine' : 'other') + (m.failed ? ' failed' : '');
    if (!mine) b.style.background = colorFor(m.device);

    const p = m.p;
    const u = mediaUrls.get(m.id);
    if (p.type === 'img') {
      const img = document.createElement('img');
      img.className = 'pic'; img.alt = 'Loading photo...';
      if (u) { img.src = u; img.onclick = ev => { ev.stopPropagation(); openViewer(u); }; }
      else loadMedia(m);
      b.appendChild(img);
    } else if (p.type === 'vid') {
      if (u) {
        const v = document.createElement('video');
        v.className = 'vid'; v.controls = true; v.playsInline = true; v.preload = 'metadata'; v.src = u;
        b.appendChild(v);
      } else {
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'mbtn';
        btn.textContent = '▶ Load video' + (p.size ? ' (' + fmtSize(p.size) + ')' : '');
        btn.onclick = ev => { ev.stopPropagation(); btn.textContent = 'Loading...'; loadMedia(m, true); };
        b.appendChild(btn);
      }
    } else if (p.type === 'aud') {
      if (u) {
        const a = document.createElement('audio');
        a.controls = true; a.preload = 'metadata'; a.src = u;
        b.appendChild(a);
      } else {
        const t = document.createElement('div');
        t.textContent = '🎤 Loading voice message...' + (p.dur ? ' (' + fmtDur(p.dur) + ')' : '');
        b.appendChild(t);
        loadMedia(m);
      }
    } else if (p.type === 'txt') {
      const t = document.createElement('div');
      t.textContent = p.x;
      b.appendChild(t);
    } else {
      const t = document.createElement('div');
      t.textContent = '(Unsupported message)';
      b.appendChild(t);
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    const tm = document.createElement('span');
    tm.textContent = m.failed ? 'Not saved, tap to retry' : (pending.has(m.id) ? '⏳' : d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }));
    const x = document.createElement('span');
    x.className = 'del'; x.textContent = '✕'; x.title = 'Delete';
    x.onclick = ev => { ev.stopPropagation(); removeMsg(m.id); };
    meta.append(tm, x);
    b.appendChild(meta);

    if (m.failed) b.onclick = () => retry(m.id);
    l.appendChild(b);
  }
  if (stick) l.scrollTop = l.scrollHeight;
}

/* ---------- send, delete ---------- */
async function pushToServer(m) {
  try {
    if (m.p.type !== 'txt' && !m.p.fid) {
      const bytes = new Uint8Array(await m._blob.arrayBuffer());
      const r = await apiPost({ action: 'upload', data: await encryptBytes(bytes) });
      if (!r || !r.ok) throw new Error('upload');
      m.p.fid = r.fid;
    }
    const payload = m.p.type === 'txt' ? m.p.x : JSON.stringify(m.p);
    const data = await encryptText(payload);
    const r2 = await apiPost({ action: 'add', id: m.id, time: m.time, device: m.device, data });
    if (!r2 || !r2.ok) throw new Error('add');
    pending.delete(m.id);
    m.failed = false;
  } catch (e) {
    pending.delete(m.id);
    m.failed = true;
  }
  render(true);
}
function queue(p, extra) {
  const m = { id: 'm' + Date.now() + Math.random().toString(36).slice(2, 7), time: Date.now(), device: myDevice, p };
  if (extra) Object.assign(m, extra);
  cache.set(m.id, p);
  pending.add(m.id);
  messages.push(m);
  render(true);
  $('list').scrollTop = $('list').scrollHeight;
  pushToServer(m);
  return m;
}
function send() {
  const ta = $('ta');
  const text = ta.value.trim();
  if (!text) return;
  ta.value = ''; ta.style.height = 'auto';
  queue({ type: 'txt', x: text });
}
function sendMedia(type, blob, mime, dur, size) {
  const p = { gn: 1, type, fid: '', mime };
  if (dur) p.dur = dur;
  if (size) p.size = size;
  const m = queue(p, { _blob: blob });
  mediaUrls.set(m.id, URL.createObjectURL(blob));
  render(true);
}
function compressImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const s = Math.min(1, IMG_MAX / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', IMG_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
async function sendFile(f) {
  if (f.type.indexOf('video/') === 0) {
    if (f.size > VIDEO_MAX_MB * 1048576) { alert('Video is too large (max ' + VIDEO_MAX_MB + ' MB). Send a shorter clip.'); return; }
    sendMedia('vid', f, f.type || 'video/mp4', 0, f.size);
    return;
  }
  try {
    const blob = await compressImage(f);
    sendMedia('img', blob, 'image/jpeg');
  } catch (e) { alert('Could not send this photo. Try another one.'); }
}
function retry(id) {
  const m = messages.find(x => x.id === id);
  if (!m) return;
  m.failed = false; pending.add(id); render(true);
  pushToServer(m);
}
async function removeMsg(id) {
  if (!confirm('Delete this?')) return;
  const m = messages.find(x => x.id === id);
  deleted.add(id);
  messages = messages.filter(x => x.id !== id);
  render(true);
  try { await apiPost({ action: 'del', id, fid: (m && m.p && m.p.fid) || '' }); }
  catch (e) { deleted.delete(id); /* it will come back on next sync */ }
}

/* ---------- voice message ---------- */
let rec = null, recChunks = [], recTimer = null, recStart = 0, recStream = null;
function pickMime() {
  const c = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'];
  if (!window.MediaRecorder) return '';
  for (const t of c) { if (MediaRecorder.isTypeSupported(t)) return t; }
  return '';
}
async function toggleRec() {
  if (rec) { rec.stop(); return; }
  if (!window.MediaRecorder || !navigator.mediaDevices) { alert('Voice recording is not supported in this browser.'); return; }
  try { recStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { alert('Microphone not allowed.'); return; }
  const mime = pickMime();
  rec = new MediaRecorder(recStream, mime ? { mimeType: mime } : undefined);
  recChunks = [];
  rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
  rec.onstop = () => {
    clearInterval(recTimer);
    recStream.getTracks().forEach(t => t.stop());
    const type = ((rec && rec.mimeType) || mime || 'audio/webm').split(';')[0];
    const dur = Math.round((Date.now() - recStart) / 1000);
    const blob = new Blob(recChunks, { type });
    rec = null;
    $('mic').classList.remove('on'); $('mic').textContent = '🎤';
    $('ta').placeholder = PLACEHOLDER;
    if (blob.size < 1000 || dur < 1) return;
    sendMedia('aud', blob, type, dur);
  };
  recStart = Date.now();
  rec.start();
  $('mic').classList.add('on'); $('mic').textContent = '⏹';
  recTimer = setInterval(() => {
    const s = Math.round((Date.now() - recStart) / 1000);
    $('ta').placeholder = 'Recording... ' + fmtDur(s) + '  (tap ⏹ to send)';
    if (s >= VOICE_MAX_SEC && rec) rec.stop();
  }, 500);
  $('ta').placeholder = 'Recording... 0:00  (tap ⏹ to send)';
}

/* ---------- login ---------- */
async function login(pw, auto) {
  if (!pw) return;
  if (API_URL.indexOf('PASTE_') === 0) { $('err').textContent = 'Set API_URL in the code first.'; return; }
  const btn = $('enter');
  btn.disabled = true; $('err').textContent = auto ? '' : 'Checking...';
  try {
    if (location.hash === '#hash') {
      $('err').textContent = 'Hash: ' + await pwHash(pw);
      btn.disabled = false;
      return;
    }
    if (PW_HASH && (await pwHash(pw)) !== PW_HASH) {
      try { sessionStorage.removeItem('gn_pw'); } catch (e2) {}
      $('err').textContent = 'Wrong password';
      btn.disabled = false;
      return;
    }
    key = await deriveKey(pw);
    const rows = await apiGet();
    if (rows.length) {
      try { await decryptText(rows[rows.length - 1].data); }
      catch (e) { key = null; try { sessionStorage.removeItem('gn_pw'); } catch (e2) {} $('err').textContent = 'Wrong password'; btn.disabled = false; return; }
    }
    try { sessionStorage.setItem('gn_pw', pw); } catch (e) {}
    $('lock').classList.add('hidden');
    $('app').classList.remove('hidden');
    await sync();
    $('list').scrollTop = $('list').scrollHeight;
    timer = setInterval(() => { if (!document.hidden) sync().catch(() => {}); }, POLL_MS);
  } catch (e) {
    $('err').textContent = 'Could not connect. Check internet or API_URL.';
  }
  btn.disabled = false;
}

/* ---------- events ---------- */
$('enter').onclick = () => login($('pw').value, false);
$('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login($('pw').value, false); });
$('form').addEventListener('submit', e => { e.preventDefault(); send(); });
$('ta').addEventListener('input', e => { const t = e.target; t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; });
$('ta').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
$('attach').onclick = () => $('file').click();
$('file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) sendFile(f); });
$('mic').onclick = toggleRec;
$('viewer').onclick = () => { $('viewer').classList.add('hidden'); $('viewerImg').src = ''; };
$('lockBtn').onclick = () => { try { sessionStorage.removeItem('gn_pw'); } catch (e) {} location.reload(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden && key) sync().catch(() => {}); });
/* when playback stops, apply any update that was waiting */
['pause', 'ended'].forEach(ev => $('list').addEventListener(ev, () => { if (dirty) render(true); }, true));

/* if this tab was already unlocked, enter automatically */
try { const saved = sessionStorage.getItem('gn_pw'); if (saved) login(saved, true); } catch (e) {}
</script>
</body>
</html>
